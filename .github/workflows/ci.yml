name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # No DATABASE_URL: pages that query the database are force-dynamic, so
    # neither the build nor the unit tests connect. Never inline credentials here.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  compose-and-image:
    name: Validate compose and Docker image
    runs-on: ubuntu-latest
    # docker-compose.yml only passes variables through, so validation needs none.
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build app image
        run: docker build -t scoutdeck-ci .
